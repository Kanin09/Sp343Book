<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add products form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-3">
<h2>Add products form</h2>
<form action="#" th:action="@{/addbook}" th:object="${books}" method="post">

    <div class="mb-3 mt-3">
        <label for="title" class="form-label">ISBN:</label>
        <input type="text" th:field="*{isbn}" class="form-control" id="title" name="title"/>
    </div>

    <button type="submit" class="btn btn-primary">Search</button>

</form><br><br>
</div>
</body>
</html>
