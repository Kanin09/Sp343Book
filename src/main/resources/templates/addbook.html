<!DOCTYPE HTML>
<html>
<head>
    <title>Add products form</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-3">
<h2>Add products form</h2>
<form action="#" method="post">
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Title:</label>
        <input type="text" class="form-control" id="title" name="title"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Type:</label>
        <input type="text" class="form-control" id="ptype" name="ptype"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Description:</label>
        <input type="text" class="form-control" id="description" name="description"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">File Name:</label>
        <input type="text" class="form-control" id="filename" name="filename"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Height:</label>
        <input type="text" class="form-control" id="height" name="height"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Width:</label>
        <input type="text" class="form-control" id="width" name="width"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Price:</label>
        <input type="text" class="form-control" id="price" name="price"/>
    </div>
    <div class="mb-3 mt-3">
        <label for="title" class="form-label">Rating:</label>
        <input type="text" class="form-control" id="rating" name="rating"/>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-primary">Reset</button>
</form><br><br>
</div>
</body>
</html>
